name: Update Nepali Movie Catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update catalog
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_catalog.py
      - name: Generate SEO movie pages and sitemap
        run: python scripts/generate_pages.py
      - name: Commit catalog and generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/movies.json movies sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m 'chore: update movie catalog and SEO pages'
          git push
